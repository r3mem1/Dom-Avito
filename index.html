<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A6B35">
<title>Tekisa — petites annonces au Congo</title>
<style>
:root{--g:#0A6B35;--g2:#075227;--gl:#E4F2E9;--y:#FBCF14;--yl:#FFF6CC;--r:#C8102E;--rl:#FDE8EB;--ink:#14201A;--mut:#4F5D55;--line:#D5DDD7;--bg:#F2F5F1;--card:#fff;--rad:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1B4DD8;outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
h1{font-size:1.25rem;line-height:1.25}
h2{font-size:1.1rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}
svg.i.f{fill:currentColor;stroke:none}
#app{max-width:1100px;margin:0 auto;min-height:100vh;padding-bottom:84px}
#app.nobar{padding-bottom:24px}
#app.act{padding-bottom:96px}
header.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.2rem;letter-spacing:-.01em;min-height:44px;margin-right:auto}
.logo svg{width:34px;height:34px}
.hbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border:1px solid rgba(255,255,255,.45);border-radius:999px;background:transparent;color:#fff;font-weight:600;font-size:.9rem;max-width:150px}
.hbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eco{background:var(--y);color:var(--ink);font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px}
main{padding:12px}
main:focus,main:focus-visible{outline:none}
.narrow{max-width:720px;margin:0 auto}
.sub{display:flex;align-items:center;gap:8px;margin:-4px 0 12px}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:0;background:transparent;border-radius:12px}
.ib:hover{background:rgba(0,0,0,.06)}
.search{display:flex;gap:8px}
.field{position:relative;flex:1}
.field svg{position:absolute;left:12px;top:13px;color:var(--mut)}
input[type=text],input[type=search],input[type=tel],input[type=number],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid #8A968E;border-radius:12px;background:#fff}
.field input{padding-left:42px}
textarea{min-height:110px;resize:vertical}
label.l{display:block;font-weight:600;margin:14px 0 6px}
.hint{color:var(--mut);font-size:.875rem}
.err{color:#A30D24;font-size:.875rem;font-weight:600;margin-top:4px}
[aria-invalid=true]{border-color:var(--r)!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--g);background:#fff;color:var(--g2);font-weight:700;text-align:center}
.btn.p{background:var(--g);color:#fff}
.btn.p:hover{background:var(--g2)}
.btn.y{background:var(--y);border-color:var(--y);color:var(--ink)}
.btn.w{background:#128C4B;border-color:#128C4B;color:#fff}
.btn.d{border-color:var(--r);color:#A30D24}
.btn.full{width:100%}
.btn.sm{min-height:44px;padding:0 12px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.sec{margin:20px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec a{color:var(--g2);font-weight:700;font-size:.9rem;min-height:44px;display:inline-flex;align-items:center}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);text-align:center;font-size:.75rem;font-weight:600;line-height:1.2;min-height:92px}
.cat:hover{border-color:var(--g)}
.cat .ci{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.cat small{color:var(--mut);font-weight:500}
.banner{margin-top:16px;background:var(--g2);color:#fff;border-radius:var(--rad);padding:16px;display:flex;gap:12px;align-items:center;border-left:8px solid var(--y)}
.banner p{font-size:.9rem;opacity:.95}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.hs>*{flex:0 0 156px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}
.card a.cl{display:block;height:100%}
.card:hover{border-color:var(--g)}
.cb{padding:8px 10px 10px}
.price{font-weight:800;font-size:1.05rem;line-height:1.3}
.price small{font-weight:600;font-size:.8rem;color:var(--mut)}
.eur{color:var(--mut);font-size:.8rem;font-weight:500;white-space:nowrap}
.tt{font-size:.9rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0}
.meta{color:var(--mut);font-size:.8rem}
.meta svg,.hint svg,.vf svg{vertical-align:-3px}
.meta>svg:first-child{margin-right:3px}
.ph{position:relative;aspect-ratio:4/3;display:grid;place-items:center}
.ph svg.i{width:42%;height:42%;max-width:72px;stroke-width:1.4;opacity:.85}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lowd .ph{background:#E3E7E4!important;color:#5A655E!important}
.bdg{position:absolute;left:8px;top:8px;display:flex;gap:4px}
.tag{font-size:.7rem;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em}
.tag.u{background:var(--r);color:#fff}
.tag.v{background:var(--y);color:var(--ink)}
.tag.ok{background:var(--gl);color:var(--g2)}
.tag.md{background:var(--yl);color:#5C4700}
.tag.sd{background:#E3E7E4;color:#3A443E}
.fav{position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink)}
.fav[aria-pressed=true]{color:var(--r)}
.fav[aria-pressed=true] svg{fill:currentColor}
.card.row a.cl{display:flex}
.card.row .ph{flex:0 0 120px;aspect-ratio:1}
.card.row .cb{flex:1;padding-right:48px}
.listv{display:grid;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-weight:600;font-size:.9rem;white-space:nowrap}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.chip .n{background:var(--y);color:var(--ink);border-radius:999px;padding:0 7px;font-size:.75rem}
.tools{display:flex;gap:8px;align-items:center;margin:4px 0 10px}
.tools select{min-height:44px;width:auto;flex:1;padding:6px 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-top:12px}
.tip{background:var(--yl);border:1px solid #E5C200;border-radius:var(--rad);padding:12px 14px;margin-top:12px;display:flex;gap:10px;font-size:.9rem}
.tip ul{margin:4px 0 0;padding-left:18px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--rad);margin:0 -12px;gap:2px}
.gal .ph{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;max-height:420px}
dl.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:8px 0 0}
dl.specs dt{color:var(--mut)}
dl.specs dd{margin:0;font-weight:600}
.map{height:130px;border-radius:12px;background:#DDE9E1;position:relative;overflow:hidden;margin-top:10px;display:grid;place-items:center;color:var(--r)}
.map svg.bgm{position:absolute;inset:0;width:100%;height:100%}
.map svg.i{width:36px;height:36px;position:relative;fill:#fff}
.seller{display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.av.lg{width:76px;height:76px;font-size:1.5rem}
.stars{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:#7A5B00}
.vf{display:inline-flex;align-items:center;gap:4px;color:var(--g2);font-weight:700;font-size:.85rem}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.actbar>div{max-width:720px;margin:0 auto;display:flex;gap:8px}
.actbar .btn{flex:1;padding:0 8px;font-size:.9rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar ul{list-style:none;margin:0 auto;padding:0;display:flex;max-width:560px}
.tabbar li{flex:1}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;font-size:.7rem;font-weight:600;color:var(--mut)}
.tabbar a[aria-current]{color:var(--g2)}
.tabbar a.sell span.c{width:44px;height:36px;border-radius:12px;background:var(--y);color:var(--ink);display:grid;place-items:center}
.dot{background:var(--r);color:#fff;border-radius:999px;font-size:.7rem;padding:0 6px;font-weight:700}
.state{text-align:center;padding:40px 16px;color:var(--mut)}
.state svg.i{width:56px;height:56px;color:var(--g);stroke-width:1.5}
.state h2{color:var(--ink);margin:10px 0 4px}
.state .btn{margin-top:14px}
.sk{background:linear-gradient(90deg,#E3E8E4 25%,#EEF2EF 40%,#E3E8E4 60%);background-size:300% 100%;animation:sk 1.2s infinite linear;border-radius:12px}
@keyframes sk{to{background-position:-150% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}*{scroll-behavior:auto!important}}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,20,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;font-weight:600}
.opt[aria-pressed=true],.opt[aria-checked=true]{color:var(--g2)}
.opt .ck{margin-left:auto;color:var(--g)}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--g)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prog{height:8px;background:#DCE3DE;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--g);border-radius:99px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left;font-weight:600;font-size:.875rem;line-height:1.2}
.pick button[aria-pressed=true]{border-color:var(--g);background:var(--gl)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumbs .th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#E3E7E4}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .th button{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:transparent;color:#fff;display:grid;place-items:start end;padding:4px}
.thumbs .th button span{background:rgba(0,0,0,.7);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.add{aspect-ratio:1;border:2px dashed #8A968E;border-radius:10px;display:grid;place-items:center;color:var(--g2);cursor:pointer;background:#fff}
.foot{display:flex;gap:8px;margin-top:20px}
.foot .btn{flex:1}
.rw{display:flex;gap:12px;align-items:center}
.li{display:flex;gap:12px;align-items:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:var(--rad);margin-top:8px;min-height:64px}
.li .g{flex:1;min-width:0}
.li .g p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{flex:1;min-height:44px;border:0;border-bottom:3px solid transparent;background:transparent;font-weight:700;color:var(--mut)}
.tabs button[aria-selected=true]{color:var(--g2);border-color:var(--g)}
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:150px}
.m{max-width:80%;padding:8px 12px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.m.me{align-self:flex-end;background:var(--g);border-color:var(--g);color:#fff}
.m small{display:block;opacity:.8;font-size:.7rem;text-align:right}
.composer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:15}
.composer>div{max-width:720px;margin:0 auto}
.composer form{display:flex;gap:8px}
.tl{list-style:none;padding:0;margin:8px 0 0}
.tl li{display:flex;gap:12px;padding:0 0 18px;position:relative}
.tl li:before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl .b{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:#fff;color:var(--mut);font-weight:700;font-size:.85rem}
.tl li.done .b{background:var(--g);border-color:var(--g);color:#fff}
.tl li.cur .b{border-color:var(--g);color:var(--g2)}
.tl li.done:before{background:var(--g)}
.radio{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;font-weight:600;background:#fff}
.radio input{width:22px;height:22px;accent-color:var(--g)}
.radio small{display:block;font-weight:500;color:var(--mut)}
.radio .pr{margin-left:auto;font-weight:800;white-space:nowrap}
.sum{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.sum.t{border-top:1px solid var(--line);font-weight:800;margin-top:4px;padding-top:10px}
.offl{background:var(--r);color:#fff;text-align:center;font-size:.85rem;font-weight:700;padding:6px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:60;background:#14201A;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.otp{letter-spacing:.5em;text-align:center;font-size:1.4rem;font-weight:800}
.pfx{display:flex;gap:8px}
.pfx b{display:grid;place-items:center;min-height:48px;padding:0 12px;border:1.5px solid #8A968E;border-radius:12px;background:#EEF2EF}
@media (min-width:700px){
 .cats{grid-template-columns:repeat(6,1fr)}
 .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
 .hs>*{flex-basis:200px}
 .gal{margin:0}
 .overlay{align-items:center}
 .sheet{border-radius:18px}
 h1{font-size:1.5rem}
}
</style>
</head>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>

  (!f.cond || a.cond === f.cond) &&
  (!f.verified || seller(a.seller).v) &&
  (!f.deliv || a.deliv) &&
  (!(f.furn && f.cat === 'immo') || a.furn));
 if(f.sort === 'asc') r.sort((a,b) => a.price - b.price);
 else if(f.sort === 'desc') r.sort((a,b) => b.price - a.price);
 else r.sort((a,b) => (b.vip - a.vip) || (a.days - b.days));
 return r;
}

 if(state.sheet){ const f = (fid && document.getElementById(fid)) || app.querySelector('.sheet button, .sheet select, .sheet input'); f && f.focus(); }

function onRoute(){
 const parts = (location.hash.replace(/^#\/?/, '') || '').split('/').map(decodeURIComponent);
 state.route = parts; state.sheet = null; state.errors = {};
 if(parts[0] === 'list' && parts[1] !== undefined) state.filters.cat = CATS.some(c => c.id === parts[1]) ? parts[1] : '';
 if(parts[0] === 'chat'){ const c = state.chats.find(x => x.id === parts[1]); if(c) c.unread = 0; }
 if(parts[0] === 'promote') state.promo.done = false;
 state.loading = NET.includes(parts[0]) && !isOffline();

function validateStep(){
 const D = state.draft, e = {};
 if(D.step === 1 && !D.cat) e.cat = 'Choisissez une catégorie.';
 if(D.step === 3){
  if(D.title.trim().length < 5) e.title = 'Le titre doit contenir au moins 5 caractères.';
  if(!(+D.price > 0)) e.price = 'Indiquez un prix en FCFA.';
  if(!['immo','job','serv'].includes(D.cat) && !D.cond) e.cond = 'Précisez l’état de l’article.';
  if(D.desc.trim().length < 10) e.desc = 'Décrivez l’article en quelques mots (10 caractères minimum).';
 }
 if(D.step === 4 && D.lm.trim().length < 3) e.lm = 'Indiquez au moins un repère connu.';
 if(D.step === 5){ if(!D.phone && state.user) D.phone = state.user.phone; if(!/^0[456]\d{7}$/.test(D.phone)) e.phone = 'Numéro à 9 chiffres commençant par 04, 05 ou 06.'; }
 state.errors = e; return !Object.keys(e).length;
}
function focusFirstError(){ const el = document.querySelector('[aria-invalid=true]') || document.querySelector('.err'); el && el.focus && el.focus(); }
function publish(){

 if(!state.user){ state.login = {step:1,phone:D.phone,code:'',ret:'#/post'}; toast('Vérifiez votre numéro pour publier.'); return go('#/login'); }
 if(D.editId){ const m = state.myAds.find(x => x.id === D.editId); if(m){ m.t = D.title.trim(); m.price = +D.price; m.cat = D.cat; m.status = 'mod'; m.d = {cond:D.cond,desc:D.desc,city:D.city,area:D.area,lm:D.lm}; } toast('Annonce modifiée, en modération.'); state.draft = emptyDraft(); return go('#/mine'); }
 state.myAds.unshift({id:'m' + Date.now(), t:D.title.trim(), cat:D.cat, price:+D.price, status:'mod', views:0, boost:null, d:{cond:D.cond,desc:D.desc,city:D.city,area:D.area,lm:D.lm}});
 state.posted = D.title.trim(); state.draft = emptyDraft();
 try{ localStorage.removeItem('tekisa_draft'); }catch(_){}

function addPhotos(files){
 const D = state.draft, room = 8 - D.photos.length;
 if(files.length > room) toast('Maximum 8 photos.');
 [...files].slice(0, room).forEach(f => { const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
   const k = Math.min(1, 1024 / Math.max(im.width, im.height)), c = document.createElement('canvas');
   c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
   c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
   const url = c.toDataURL('image/jpeg', .7);
   if(D.photos.length < 8){ D.photos.push({url, kb:Math.round(url.length * .75 / 1024)}); render(); } };
   im.onerror = () => toast('Photo illisible, essayez-en une autre.'); im.src = rd.result; };
  rd.readAsDataURL(f); });
}

 city(el){ state.city = el.dataset.v; state.filters.area = ''; state.sheet = null; render(); },
 cat(el){ state.filters.cat = el.dataset.v; if(el.dataset.v !== 'immo') state.filters.furn = false; go('#/list' + (el.dataset.v ? '/' + el.dataset.v : '')); },
 reset(){ state.filters = emptyFilters(); },
 clearf(){ const c = state.filters.cat; state.filters = emptyFilters(); state.filters.cat = c; render(); },
 view(){ state.view = state.view === 'grid' ? 'list' : 'grid'; render(); },
 retry(){ if(isOffline()) toast('Toujours hors ligne.'); else onRoute(); },
 stopsim(){ state.offline = false; onRoute(); },
 pickcat(el){ state.draft.cat = el.dataset.v; state.errors = {}; render(); },
 pprev(){ state.draft.step--; state.errors = {}; render(); window.scrollTo(0,0); },
 rmphoto(el){ state.draft.photos.splice(+el.dataset.v, 1); render(); },
 savedraft(){ const {photos, ...d} = state.draft; try{ localStorage.setItem('tekisa_draft', JSON.stringify(d)); }catch(_){} toast('Brouillon enregistré' + (photos.length ? ' (photos gardées jusqu’à la fermeture de la page)' : '')); },
 postdone(){ state.posted = null; },
 promodone(){ state.promo.done = false; },
 login(el){ state.login = {step:1,phone:'',code:'',ret:el.dataset.v || '#/me'}; go('#/login'); },
 relogin(){ state.login.step = 1; state.login.code = ''; state.errors = {}; render(); },
 logout(){ state.user = null; toast('Vous êtes déconnecté.'); render(); },
 chatopen(el){ const a = ad(el.dataset.id); let c = state.chats.find(x => x.ad === a.id);
  if(!c){ c = {id:'c' + Date.now(), seller:a.seller, ad:a.id, unread:0, msgs:[]}; state.chats.unshift(c); } go('#/chat/' + c.id); },
 quick(el){ sendMsg(el.dataset.v); },
 escrow(el){ go('#/escrow/' + el.dataset.id); },
 dealnext(el){ const d = state.deals[el.dataset.id]; d.step++; render();
  if(d.step === 3) setTimeout(() => { d.step = 4; toast('Fonds versés au vendeur.'); if(state.route[0]==='escrow') render(); }, 1200); },
 editad(el){ const m = state.myAds.find(x => x.id === el.dataset.v);
  state.draft = Object.assign(emptyDraft(), {editId:m.id, cat:m.cat, title:m.t, price:String(m.price), step:3, phone:state.user?state.user.phone:''}, m.d||{}); state.posted = null; go('#/post'); },
 retire(el){ state.myAds = state.myAds.filter(x => x.id !== el.dataset.v); toast('Annonce retirée.'); render(); }
};
const FORMS = {
 search(f){ state.filters = emptyFilters(); state.filters.q = f.q.value; go('#/list'); },
 post(){ if(!validateStep()){ render(); return focusFirstError(); }
  if(state.draft.step < 5){ state.draft.step++; render(); window.scrollTo(0,0); const m = $('#main'); m && m.focus({preventScroll:true}); } else publish(); },
 phone(){ if(!/^0[456]\d{7}$/.test(state.login.phone)){ state.errors = {lphone:'Numéro à 9 chiffres commençant par 04, 05 ou 06.'}; render(); return focusFirstError(); }
  state.errors = {}; state.login.step = 2; render(); toast('Code envoyé par SMS (démo : ' + DEMO_OTP + ')'); const o = $('#lo'); o && o.focus(); },
 otp(){ if(state.login.code !== DEMO_OTP){ state.errors = {lcode:'Code incorrect. Réessayez.'}; render(); return focusFirstError(); }
  state.user = {phone:state.login.phone, verified:true}; toast('Numéro vérifié. Bienvenue !'); go(state.login.ret || '#/me'); },
 msg(f){ sendMsg(f.x.value); },
 report(){ state.sheet = null; render(); toast('Merci. Notre équipe examine votre signalement.'); },
 escrow(){ const id = state.route[1];
  if(!state.user){ state.login = {step:1,phone:'',code:'',ret:'#/escrow/' + id}; toast('Connectez-vous pour payer.'); return go('#/login'); }
  if(state.escrowPay === 'cash') return;
  state.deals[id] = {step:1, pay:state.escrowPay}; render(); window.scrollTo(0,0); toast('Paiement reçu en séquestre.'); },
 promo(){ if(!state.user){ state.login = {step:1,phone:'',code:'',ret:location.hash}; return go('#/login'); }
  const m = state.myAds.find(x => x.id === state.route[1]), o = PROMOS.find(p => p.id === state.promo.opt);
  if(o.id === 'up'){ state.myAds = [m, ...state.myAds.filter(x => x !== m)]; m.boost = 'Remontée'; } else m.boost = o.n;
  state.promo.done = true; render(); }
};

/* ===== Démarrage ===== */
function init(){
 try{ const d = JSON.parse(localStorage.getItem('tekisa_draft') || 'null'); if(d) state.draft = Object.assign(emptyDraft(), d, {photos:[]}); }catch(_){}
 document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if(!el || el.disabled) return; const fn = ACT[el.dataset.act]; if(fn) fn(el, e); });
 document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if(!f) return; e.preventDefault(); FORMS[f.dataset.form](f); });
 document.addEventListener('input', e => { const el = e.target;
  if(el.dataset.photos) return;
  if(!el.dataset.m || el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT') return;
  if(el.dataset.num) el.value = el.value.replace(/\D/g, '');
  setPath(state, el.dataset.m, el.value);
  if(el.dataset.live){ const r = $('#results'); if(r) r.innerHTML = resultsHtml(); }
  if(el.dataset.cnt){ const c = $('#fcount'); if(c) c.textContent = filtered().length; }
  if(el.dataset.eur){ const h = $('#eurh'); if(h) h.textContent = el.value ? fcfa(+el.value) + ' ' + eur(+el.value) : 'Prix en francs CFA, sans centimes.'; } });
 document.addEventListener('change', e => { const el = e.target;
  if(el.dataset.photos){ addPhotos(el.files); return; }
  if(!el.dataset.m) return;
  if(el.type === 'checkbox') setPath(state, el.dataset.m, el.checked);
  else if(el.type === 'radio' || el.tagName === 'SELECT') setPath(state, el.dataset.m, el.value);
  else return;
  if(el.dataset.m === 'city') state.filters.area = '';
  if(el.dataset.m === 'draft.city') state.draft.area = '';
  if(el.dataset.m === 'offline'){ return onRoute(); }
  if(el.dataset.rr) render(); });
 document.addEventListener('keydown', e => { if(e.key === 'Escape' && state.sheet){ state.sheet = null; render(); }
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('add')){ e.preventDefault(); e.target.querySelector('input').click(); } });
 window.addEventListener('hashchange', onRoute);
 window.addEventListener('online', onRoute); window.addEventListener('offline', onRoute);
 onRoute();
}
if(typeof document !== 'undefined') init();
if(typeof module !== 'undefined') module.exports = {state, view, sheet, header, tabbar, filtered, validateStep, ADS, CATS, SELLERS, emptyFilters, fcfa, eur};
</script>
</body>
</html>
